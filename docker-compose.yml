services:
  # Nom du service
  portainer:
    # lien vers l'image docker hub
    image: portainer/portainer-ce:alpine
    # Nom du container pour docker
    container_name: portainer
    # Définie restart a quel moment: redémarre automatiquement tant que nous stoppont pas le container
    restart: unless-stopped
    # Définie le réseau utiliser pour le container
    networks:
        - cloud
    # Définie l'exposition des ports réseaux du container
    ports:
     - 9000:9000
    # Définie le volume utiliser dans le container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Volume définie dans la section volumes
      - portainer_data:/data
    # Définie le label que le service Traefik va utiliser pour faire le reverse proxy dans le réseau docker
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.portainer.rule=Host(`portainer.${MY_DOMAIN}`)'
      - 'traefik.http.routers.portainer.entryPoints=websecure'
  # Nom du service
  nextclouddb:
    # lien vers l'image docker hub
    image: mariadb
    # Nom du container pour docker
    container_name: nextcloud-db
    # Définie restart a quel moment: redémarre automatiquement tant que nous stoppont pas le container
    restart: unless-stopped
    # 
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    # Définie le réseau utiliser pour le container
    networks:
      - cloud
    # Définie le volume utiliser dans le container
    volumes:
      - nextclouddb:/var/lib/mysql
    # Définie les variable d'environement que mariadb a bessoin pour faire fonctionner le service
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montreal
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}
  # Nom du service
  nextcloud:
    # Images sur docker hub
    image: nextcloud
    # Définie le nom du container pour docker
    container_name: nextcloud
    # Définie restart a quel moment: redémarre automatiquement tant que nous stoppont pas le container
    restart: unless-stopped
    # Définie le réseau utiliser pour le container
    networks:
      - cloud
    # Définie le moment quand t'il va partir, il va partir seulement quand la base de donné nextcloud db seras partie
    depends_on:
      - nextclouddb
    # Définie l'exposition des ports réseaux du container
    ports:
      - 8081:80
    # Définie le volume utiliser dans le container
    volumes:
      - /html:/var/www/html
      - /custom_apps:/var/www/html/custom_apps
      - /config:/var/www/html/config
      - /data:/var/www/html/data
    # Définie les variable d'environement que mariadb a bessoin pour faire fonctionner le service
    environment:
      - PUID=1000 
      - PGID=1000 
      - TZ=America/Montreal
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}
    # Définie le label que le service Traefik va utiliser pour faire le reverse proxy dans le réseau docker
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nextcloud.rule=Host(`nextcloud.${MY_DOMAIN}`)'
      - 'traefik.http.routers.nextcloud.entryPoints=websecure'
 
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - cloud
    ports:
      - 8096:8096
    environment:
      - TZ=America/Montreal
    volumes:
      - jellyfin_data:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/TV:/tv
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MY_DOMAIN}`)'
      - 'traefik.http.routers.jellyfin.entryPoints=websecure'
  proxy:
    image: traefik
    container_name: traefik
    restart: unless-stopped
    networks:
        - cloud
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns"
      - "--certificatesresolvers.letsencrypt.acme.email=mail@mail.com"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.disablePropagationCheck=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certResolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=${MY_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${MY_DOMAIN}"
    volumes:
      - "../data/traefik/letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${MY_DOMAIN}`)'
      - 'traefik.http.routers.api.entryPoints=websecure'
      - 'traefik.http.routers.api.service=api@internal'
    ports:
      - "443:443"
      - "80:80"
    environment:
      - "DUCKDNS_TOKEN=${DUCKDNS_TOKEN}"
    
  backend:
    image: marcantoinemercier/tp02-trackb_backend:v1
    container_name: backend_trackb
    build:
      context: ./backend
    ports:
      - 9090:9090
    networks:
      - cloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.${MY_DOMAIN}`)"
      - "traefik.http.routers.backend.entryPoints=websecure"

  frontend:
    image: marcantoinemercier/tp02-trackb_frontend:v1
    container_name: frontend_trackb
    build:
      context: ./frontend
    ports:
      - "9191:80"
    depends_on: 
      - backend
    networks:
      - cloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontendtrack.rule=Host(`frontendtrack.${MY_DOMAIN}`)"
      - "traefik.http.routers.frontendtrack.entryPoints=websecure"
 
volumes:
    portainer_data:
    nextclouddb:
    jellyfin_data:
 
networks:
    cloud:
      driver: bridge