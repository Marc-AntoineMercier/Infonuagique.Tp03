services:
  # Nom du service
  portainer:
    # Lien vers l'image sur Docker Hub
    image: portainer/portainer-ce:alpine
    # Nom du conteneur Docker
    container_name: portainer
    # Redémarre automatiquement sauf si le conteneur est arrêté manuellement
    restart: unless-stopped
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - 9000:9000
    # Volumes montés dans le conteneur
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.portainer.rule=Host(`portainer.${MY_DOMAIN}`)'
      - 'traefik.http.routers.portainer.entryPoints=websecure'

  # Nom du service
  nextclouddb:
    # Lien vers l'image sur Docker Hub
    image: mariadb
    # Nom du conteneur Docker
    container_name: nextcloud-db
    # Redémarre automatiquement sauf si le conteneur est arrêté manuellement
    restart: unless-stopped
    # Commande personnalisée à exécuter au démarrage du conteneur
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Volumes montés dans le conteneur
    volumes:
      - nextclouddb:/var/lib/mysql
    # Variables d’environnement utilisées par MariaDB
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montreal
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}

  # Nom du service
  nextcloud:
    # Lien vers l'image sur Docker Hub
    image: nextcloud
    # Nom du conteneur Docker
    container_name: nextcloud
    # Redémarre automatiquement sauf si le conteneur est arrêté manuellement
    restart: unless-stopped
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Démarrage différé jusqu'à ce que 'nextclouddb' soit prêt
    depends_on:
      - nextclouddb
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - 8081:80
    # Volumes montés dans le conteneur
    volumes:
      - /html:/var/www/html
      - /custom_apps:/var/www/html/custom_apps
      - /config:/var/www/html/config
      - /data:/var/www/html/data
    # Variables d’environnement pour configurer Nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montreal
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nextcloud.rule=Host(`nextcloud.${MY_DOMAIN}`)'
      - 'traefik.http.routers.nextcloud.entryPoints=websecure'

  # Nom du service
  jellyfin:
    # Lien vers l'image sur Docker Hub
    image: jellyfin/jellyfin:latest
    # Nom du conteneur Docker
    container_name: jellyfin
    # Redémarre automatiquement sauf si le conteneur est arrêté manuellement
    restart: unless-stopped
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - 8096:8096
    # Variables d’environnement pour configurer Jellyfin
    environment:
      - TZ=America/Montreal
    # Volumes montés dans le conteneur
    volumes:
      - jellyfin_data:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/TV:/tv
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MY_DOMAIN}`)'
      - 'traefik.http.routers.jellyfin.entryPoints=websecure'

  # Nom du service
  proxy:
    # Lien vers l'image sur Docker Hub
    image: traefik
    # Nom du conteneur Docker
    container_name: traefik
    # Redémarre automatiquement sauf si le conteneur est arrêté manuellement
    restart: unless-stopped
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Commandes Traefik passées en ligne de commande
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns"
      - "--certificatesresolvers.letsencrypt.acme.email=mail@mail.com"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.disablePropagationCheck=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certResolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=${MY_DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${MY_DOMAIN}"
    # Volumes montés dans le conteneur
    volumes:
      - "../data/traefik/letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${MY_DOMAIN}`)'
      - 'traefik.http.routers.api.entryPoints=websecure'
      - 'traefik.http.routers.api.service=api@internal'
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - "443:443"
      - "80:80"
    # Variables d’environnement pour le DNS challenge avec DuckDNS
    environment:
      - "DUCKDNS_TOKEN=${DUCKDNS_TOKEN}"

  # Nom du service
  backend:
    # Lien vers l'image sur Docker Hub
    image: marcantoinemercier/tp02-trackb_backend:v1
    # Nom du conteneur Docker
    container_name: backend_trackb
    # Construit l'image à partir du contexte local
    build:
      context: ./backend
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - 9090:9090
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.${MY_DOMAIN}`)"
      - "traefik.http.routers.backend.entryPoints=websecure"

  # Nom du service
  frontend:
    # Lien vers l'image sur Docker Hub
    image: marcantoinemercier/tp02-trackb_frontend:v1
    # Nom du conteneur Docker
    container_name: frontend_trackb
    # Construit l'image à partir du contexte local
    build:
      context: ./frontend
    # Mappage des ports hôtes vers les ports du conteneur
    ports:
      - "9191:80"
    # Dépendance sur le service backend
    depends_on:
      - backend
    # Réseau utilisé pour ce conteneur
    networks:
      - cloud
    # Étiquettes utilisées par Traefik pour le reverse proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontendtrack.rule=Host(`frontendtrack.${MY_DOMAIN}`)"
      - "traefik.http.routers.frontendtrack.entryPoints=websecure"
 
# Définition des volumes Docker utilisés pour la persistance des données
volumes:
  # Volume pour stocker les données de Portainer
  portainer_data:
  # Volume pour stocker les données de la base de données Nextcloud (MariaDB)
  nextclouddb:
  # Volume pour stocker la configuration de Jellyfin
  jellyfin_data:

# Définition du réseau Docker utilisé par tous les conteneurs
networks:
  cloud:
    # Type de réseau utilisé : bridge = réseau privé Docker pour permettre aux conteneurs de communiquer entre eux
    driver: bridge
